<title>Letters Are Alive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one full-screen scene (alpine valley under the Alps) with a slim top bar; each game fills the valley floor. */
:root {
  --sky-hi: #8fcbef; --sky-lo: #e4f4fb;
  --snow: #fbfdff; --rock: #8a9bb3; --rock-dk: #62758f;
  --meadow: #86c45b; --meadow-dk: #4e9a3f; --meadow-lt: #b5de84;
  --falu: #9e2b25; --falu-dk: #6f1c18;
  --sv-yellow: #fecc02; --sv-blue: #1d5ea8;
  --pond: #4aa9c2; --pond-dk: #2f7f98; --pad: #5fae4a;
  --ink: #1f2d3d; --ink-soft: #4a5a6c; --paper: #fffbf2; --paper-edge: #eadfc8;
  --good: #2e9d52; --miss: #d0612d;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-read: "Andika", "Century Gothic", "Avenir Next", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky-lo); color: var(--ink); font-family: var(--font-display);
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--sv-yellow); outline-offset: 3px; }

#app { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
#scenery { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.cloud { position: absolute; z-index: 0; width: 180px; height: 52px; background: var(--snow); border-radius: 40px; opacity: .85;
  animation: drift 90s linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: var(--snow); border-radius: 50%; }
.cloud::before { width: 80px; height: 70px; left: 28px; top: -34px; }
.cloud::after { width: 60px; height: 52px; left: 92px; top: -22px; }
@keyframes drift { from { transform: translateX(-240px); } to { transform: translateX(110vw); } }

.bar { position: relative; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.bar .grow { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 3px solid var(--paper-edge);
  border-radius: 999px; padding: 4px 14px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.round { width: 56px; height: 56px; border-radius: 50%; background: var(--paper); border: 3px solid var(--paper-edge);
  font-size: 28px; display: grid; place-items: center; flex: none; box-shadow: 0 3px 0 var(--paper-edge); }
.round:active { transform: translateY(2px); box-shadow: none; }
.bells { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.bell { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.55); border: 3px solid rgba(31,45,61,.15); }
.bell.ok { background: var(--sv-yellow); border-color: #c99d00; }
.bell.miss { background: #f3c7a4; border-color: var(--miss); }

  justify-content: center; gap: 18px; padding: 8px 16px 24px; }
.scroll { overflow-y: auto; justify-content: flex-start; -webkit-overflow-scrolling: touch; }

.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99d00; }

/* ---- map ---- */
.map { position: relative; width: min(720px, 100%); padding-block: 12px 40px; display: flex; flex-direction: column-reverse; gap: 14px; }
.map svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node { position: relative; display: flex; align-items: center; gap: 12px; width: max-content; max-width: 100%; }
.node .dot { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; flex: none;
  background: var(--paper); border: 5px solid var(--paper-edge); box-shadow: 0 5px 0 rgba(0,0,0,.12); }
.node.done .dot { background: var(--snow); border-color: var(--good); }
.node.current .dot { background: var(--sv-yellow); border-color: var(--falu); animation: bob 1.6s ease-in-out infinite; }
.node.locked .dot { background: #dfe6ec; border-color: #c4ced8; color: #9aa7b4; font-size: 28px; }
.node .lbl { background: rgba(255,251,242,.92); border-radius: 14px; padding: 4px 12px; font-size: 19px; line-height: 1.15; min-width: 0; }

.node.locked .lbl { opacity: .6; }

.card { background: var(--paper); border: 4px solid var(--paper-edge); border-radius: 28px; padding: 22px; width: min(640px, 100%);

.tiles { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  border-radius: 20px; background: var(--snow); border: 4px solid var(--sv-blue); color: var(--ink); display: grid; place-items: center; }
.tile.small { font-size: 34px; min-width: 60px; height: 60px; border-radius: 14px; border-width: 3px; }

.reward .shadow { font-size: 54px; filter: brightness(0) opacity(.35); }

.eggs { display: flex; gap: clamp(12px, 3vw, 36px); flex-wrap: wrap; justify-content: center; }

  background: radial-gradient(circle at 35% 30%, #fff 0 18%, #f7ecd8 60%, #e8d6b5); border: 4px solid #d8c29c;
  font-family: var(--font-read); font-weight: 700; font-size: clamp(46px, 7vw, 64px); display: grid; place-items: center;
  box-shadow: 0 8px 0 rgba(0,0,0,.1); }
.glow { box-shadow: 0 0 0 6px var(--sv-yellow), 0 0 28px 8px rgba(254,204,2,.8) !important; animation: bob 1s ease-in-out infinite; }
.flower.glow { border-radius: 50%; }

/* ---- pond hop ---- */
.pond { position: relative; width: min(960px, 100%); padding: 36px 16px 120px; border-radius: 48% 52% 40% 44% / 30% 30% 22% 22%;
  background: radial-gradient(ellipse at 50% 40%, #7cc7d9, var(--pond) 55%, var(--pond-dk)); border: 6px solid #8bc47a; }
.pads { display: flex; justify-content: center; gap: clamp(6px, 1.6vw, 18px); padding-left: clamp(40px, 8vw, 90px); }
.pad { position: relative; width: clamp(64px, 14vw, 132px); aspect-ratio: 1; max-width: 100%; border-radius: 50%;

  display: grid; place-items: center; font-family: var(--font-read); font-weight: 700; font-size: clamp(34px, 7vw, 66px); color: var(--ink);

.pad.lit { background: radial-gradient(circle at 40% 35%, #fff6b3, var(--sv-yellow) 75%); border-color: #c99d00; transform: scale(1.06); }

.choices { display: flex; gap: clamp(12px, 3vw, 28px); flex-wrap: wrap; justify-content: center; }
.pic { width: clamp(118px, 22vw, 176px); aspect-ratio: 1; max-width: 100%; border-radius: 28px; background: var(--paper); border: 5px solid var(--paper-edge);

  border-bottom: 6px solid var(--ink); display: grid; place-items: center; color: var(--falu); }
.flowers { display: flex; gap: clamp(10px, 2vw, 18px); flex-wrap: wrap; justify-content: center; max-width: 760px; }
.flower { position: relative; width: clamp(84px, 13vw, 112px); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center;
  font-family: var(--font-read); font-weight: 700; font-size: clamp(34px, 6vw, 50px); color: var(--ink); }
.flower::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%;
  background: radial-gradient(circle, var(--sv-yellow) 0 30%, transparent 31%),
    conic-gradient(from 0deg, var(--snow) 0 10%, #f1f4f7 10% 12.5%, var(--snow) 12.5% 22.5%, #f1f4f7 22.5% 25%, var(--snow) 25% 35%, #f1f4f7 35% 37.5%, var(--snow) 37.5% 47.5%, #f1f4f7 47.5% 50%, var(--snow) 50% 60%, #f1f4f7 60% 62.5%, var(--snow) 62.5% 72.5%, #f1f4f7 72.5% 75%, var(--snow) 75% 85%, #f1f4f7 85% 87.5%, var(--snow) 87.5% 97.5%, #f1f4f7 97.5%);
  box-shadow: 0 5px 0 rgba(0,0,0,.1); }
.flower.used { visibility: hidden; }

/* ---- story barn ---- */
.sentence { display: flex; gap: 10px 16px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
.readtrack { position: relative; padding-bottom: 96px; max-width: 100%; }
.readtrack .sentence { flex-wrap: nowrap; white-space: nowrap; }
.frog.reader { bottom: 0; font-size: clamp(52px, 8vw, 72px); }
.sw.lit { background: var(--sv-yellow); }
.sw { font-family: var(--font-read); font-weight: 700; font-size: clamp(22px, 5.2vw, 56px); padding: 2px 10px; border-radius: 14px; background: rgba(255,251,242,.9); }
.sw.heart { color: var(--falu); }
.sw.heart::after { content: "♥"; font-size: .4em; vertical-align: super; margin-left: 2px; }
.yn { display: flex; gap: 24px; }
.yn button { font-size: 64px; width: 120px; height: 110px; border-radius: 28px; background: var(--paper); border: 5px solid var(--paper-edge); box-shadow: 0 7px 0 rgba(0,0,0,.1); }

/* ---- speech bubble / feedback ---- */
.say-btn { font-size: 34px; }
.bubble { background: var(--paper); border-radius: 22px; padding: 8px 20px; font-size: 24px; font-weight: 800; border: 3px solid var(--paper-edge); max-width: 90%; text-align: center; }
.shake { animation: shake .45s; }
@keyframes shake { 20%,60% { transform: translateX(-10px) rotate(-3deg); } 40%,80% { transform: translateX(10px) rotate(3deg); } }
.pop { animation: pop .5s cubic-bezier(.3,1.8,.5,1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.confetti { position: fixed; z-index: 50; pointer-events: none; font-size: 30px; animation: fall 1.4s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 70vh) rotate(540deg); opacity: 0; } }

/* ---- result ---- */
.result .stars { font-size: 56px; letter-spacing: 4px; }
.arrive { font-size: 150px; line-height: 1; animation: walkin 1.8s ease-out; }
@keyframes walkin { from { transform: translateX(-70vw) scaleX(-1); } 70% { transform: translateX(0) scaleX(-1); } }

/* ---- farm ---- */
.farm { position: relative; flex: 1; width: 100%; min-height: 0; }
.barn { position: absolute; left: 4%; bottom: 20%; width: clamp(170px, 28vw, 300px); max-width: 100%; }
.critter { position: absolute; font-size: clamp(48px, 7vw, 72px); line-height: 1; animation: wander var(--t, 9s) ease-in-out infinite alternate; }
.critter span { display: inline-block; }
.critter .name { display: block; font-size: 13px; font-weight: 800; text-align: center; background: rgba(255,251,242,.85); border-radius: 8px; padding: 0 6px; white-space: nowrap; }
@keyframes wander { 0% { transform: translateX(0); } 45% { transform: translateX(var(--w, 60px)); } 50% { transform: translateX(var(--w, 60px)) scaleX(-1); } 100% { transform: translateX(0) scaleX(-1); } }
.deco { position: absolute; font-size: clamp(40px, 6vw, 60px); line-height: 1; }
.shop { position: relative; z-index: 4; display: flex; gap: 10px; overflow-x: auto; padding: 10px 16px 14px; background: rgba(255,251,242,.92); border-top: 4px solid var(--paper-edge); }
.shop button { flex: none; display: flex; flex-direction: column; align-items: center; min-width: 78px; padding: 6px 8px; border-radius: 16px; background: var(--snow); border: 3px solid var(--paper-edge); font-size: 36px; }

.ladder-word { font-family: var(--font-read); font-weight: 700; font-size: clamp(70px, 14vw, 130px); color: var(--ink); background: var(--paper); border-radius: 30px; padding: 0 36px; border: 5px solid var(--paper-edge); }

.parent h3 { font-family: var(--font-display); font-size: 21px; }

.tenets { display: block; line-height: 1.55; font-size: 16px; }
.tenets h1 { font-family: var(--font-display); font-size: 30px; margin-bottom: 12px; }
.tenets h2 { font-size: 24px; margin: 26px 0 8px; }
.tenets h3 { margin: 18px 0 6px; }
.tenets p, .tenets li { max-width: 72ch; color: var(--ink); }
.tenets li { margin-block: 8px; }
.tenets a { color: var(--sv-blue); overflow-wrap: anywhere; }
.tenets code { font-size: .9em; background: var(--snow); padding: 0 4px; border-radius: 4px; }
.tenets hr { border: 0; border-top: 2px solid var(--paper-edge); margin: 24px 0; }
.tenets { -webkit-user-select: text; user-select: text; }
.grid-sounds { display: flex; flex-wrap: wrap; gap: 6px; }
.gs { font-family: var(--font-read); font-weight: 700; font-size: 20px; min-width: 52px; padding: 4px 6px; border-radius: 10px; text-align: center; border: 2px solid var(--paper-edge); background: var(--snow); }
.gs small { display: block; font-family: system-ui; font-weight: 600; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.gs.g { border-color: var(--good); background: #e5f7df; } .gs.w { border-color: #d4a200; background: #fff5cc; } .gs.b { border-color: var(--miss); background: #fde3d4; }
.prow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pbtn { padding: 10px 16px; border-radius: 12px; background: var(--snow); border: 2px solid var(--paper-edge); font-weight: 700; font-family: system-ui; }
.pbtn.danger { border-color: var(--miss); color: var(--miss); }
select.pbtn { font-size: 16px; }
.vmeter { display: inline-block; width: 70px; height: 12px; border-radius: 6px; background: var(--paper-edge); overflow: hidden; vertical-align: middle; margin-right: 6px; }
.vmeter i { display: block; height: 100%; background: var(--falu); }
.video-ready { background: var(--sv-yellow); border-color: #c99d00; animation: bob 1.4s ease-in-out infinite; }
.reward-card { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 20px; background: var(--paper); border: 4px solid var(--paper-edge); flex-wrap: wrap; }
.reward-card.goal { border-color: var(--falu); }
.reward-emoji { font-size: 56px; line-height: 1; }
.reward-name { font-size: 24px; font-weight: 800; }
.reward-bar { height: 14px; border-radius: 7px; background: var(--paper-edge); overflow: hidden; margin-block: 6px; }
.reward-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sv-yellow), #f0a500); }

  background: var(--paper); border: 3px solid var(--paper-edge); border-radius: 16px; padding: 8px 10px; font-size: 18px; box-shadow: 0 6px 0 rgba(0,0,0,.1); }

@media (max-width: 560px) {
  .round { width: 48px; height: 48px; font-size: 24px; }
  .chip { font-size: 18px; padding: 2px 10px; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

/* ---------------- running a stage ---------------- */
async function runStage(n, stage, stageIndex) {
  markDay();
  const lv = LEVELS[n - 1], queue = buildQueue(lv, stage), info = STAGE[stage];
  const bells = h("div", { class: "bells", "aria-label": "Progress" }, queue.map(() => h("span", { class: "bell" })));
  const area = h("div", { class: "stage" });
  const gen = screen(stage === "blend" ? "pond" : "meadow", bar(holdBtn(() => showLevel(n)), bells, starChip()), area);
  let good = 0, combo = 0;
  for (let i = 0; i < queue.length; i++) {
    if (gen !== screenGen) return;
    bells.children[i].classList.add("now");
    const { type, item } = queue[i];
    window.__current = queue[i];
    const ok = await ACTIVITIES[type](area, item, lv, gen, queue[i].silent);
    if (gen !== screenGen) return;
    const key = itemKey(type, item);
    record(key, ok);
    bells.children[i].classList.remove("now");
    bells.children[i].classList.add(ok ? "ok" : "miss");
    // a missed item comes back three turns later (it doesn't count toward passing)
    if (!ok && !queue[i].retry) {
      const at = Math.min(queue.length, i + 3);
      queue.splice(at, 0, { ...queue[i], retry: true });
      bells.insertBefore(h("span", { class: "bell retry" }), bells.children[at] || null);
    }
    if (queue[i].retry) { if (ok) addStars(1); continue; }
    if (ok) { good++; combo++; addStars(2); } else { combo = 0; addStars(1); }
    if (combo && combo % 5 === 0) { yodel(); confetti(24); }
    save();
  }
  const scored = queue.filter(q => !q.retry).length;
  const pass = good >= info.need;
  S.history.push({ d: today(), n, stage, good, of: scored });
  S.history = S.history.slice(-300);
  let levelUp = false;
  const stages = stagesFor(lv);
  if (pass) {
    S.passed[n] = Math.max(S.passed[n] || 0, stageIndex + 1);
    addStars(10);
    if (S.passed[n] >= stages.length && !S.animals.includes(n - 1)) {
      S.animals.push(n - 1);
      S.unlocked = Math.max(S.unlocked, Math.min(LEVELS.length, n + 1));
      addStars(25);
      levelUp = true;
    }
  }
  save();
  showResult(n, stage, stageIndex, good, scored, pass, levelUp);
}

function showResult(n, stage, stageIndex, good, total, pass, levelUp) {
  const lv = LEVELS[n - 1], info = STAGE[stage];
  const stars = "★".repeat(Math.round(good / total * 5)).padEnd(5, "☆");
  const kids = [h("div", { class: "stars", style: "color:#c99d00" }, stars),
    h("h2", { style: "font-size:44px" }, pass ? (levelUp ? "Level mastered!" : info.name + " mastered!") : "So close!"),
    h("div", { class: "sub" }, `${good} of ${total} on the first try. ${pass ? "" : `We need ${info.need} to move on, so let's practice once more.`}`)];
  if (levelUp) {
    kids.unshift(h("button", { class: "arrive", onclick: () => say("a_" + (n - 1)) }, lv.animal.e));
    kids.push(h("div", { class: "bubble" }, `The ${lv.animal.name} moved to your farm!`));
  }
  const next = pass ? (levelUp ? () => showLevel(Math.min(LEVELS.length, n + 1)) : () => showLevel(n)) : () => runStage(n, stage, stageIndex);
  kids.push(h("div", { style: "display:flex;gap:14px;flex-wrap:wrap;justify-content:center" },
    levelUp ? h("button", { class: "big-btn blue", onclick: showFarm }, "Visit the farm") : null,
    h("button", { class: "big-btn", onclick: next }, pass ? "Keep climbing" : "Practice again")));
  screen("meadow", bar(homeBtn(), null, starChip()), h("div", { class: "stage result card-free" }, ...kids));
  if (pass) { confetti(levelUp ? 40 : 20); arpeggio(); }
  say(levelUp ? ["q_levelup", 300, "a_" + (n - 1)] : pass ? ["q_passed"] : ["q_almost"]);
}

/* ---------------- microphone ---------------- */
/* Two optional helpers, switched on in the grown-ups corner:
   voice line: while he slides the frog and says the sounds, his voice level is watched; if it
               drops out for too long between sounds, the frog splashes back ("keep your voice on").
   word check: after sliding he taps the mic and says the word fast; the browser's speech
               recognizer shows what it heard. It never marks him wrong, because recognizers
               are unreliable with young children's voices. */
const Mic = {
  stream: null, analyser: null, buf: null, floor: .004,
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false; },
  recognizer() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; },
  async start() {
    if (this.analyser) return true;
    if (!this.supported()) return false;
    try {
      unlock();
      setSession("play-and-record");
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: true } });
      const src = AC.createMediaStreamSource(this.stream);
      this.analyser = AC.createAnalyser();
      this.analyser.fftSize = 1024;
      src.connect(this.analyser);
      this.buf = new Float32Array(1024);
      return true;
    } catch { this.stop(); return false; }
  },
  stop() {
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); setSession("playback"); }
    this.stream = null; this.analyser = null;
  },
  level() {
    if (!this.analyser) return 0;
    this.analyser.getFloatTimeDomainData(this.buf);
    let sum = 0;
    for (const v of this.buf) sum += v * v;
    return Math.sqrt(sum / this.buf.length);
  },
  async calibrate(ms = 400) {
    const m = [], end = performance.now() + ms;
    while (performance.now() < end) { m.push(this.level()); await wait(25); }
    m.sort((a, b) => a - b);
    this.floor = m[Math.floor(m.length / 2)] || .004;
  },
  threshold() { return Math.min(.08, Math.max(.012, this.floor * 3)); },
};
const micMode = () => S.mic || "off";

const SOUNDS_ALIKE = { sun: ["son"], bee: ["be", "b"], nine: ["9"], five: ["5"], six: ["6"], ten: ["10"], tee: ["t"], see: ["sea", "c"],
  pea: ["p"], jet: ["jett"], cub: ["cubbie"], mom: ["mum", "mam"], dad: ["dead"], red: ["read"], ant: ["aunt"] };
function heardIt(target, alts) {
  const ok = new Set([target, ...(SOUNDS_ALIKE[target] || [])]);
  return alts.some(a => a.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).some(w => ok.has(w)));
}
function listenFor(ms = 4000) {
  return new Promise(res => {
    const SR = Mic.recognizer();
    if (!SR) return res(null);
    let done = false;
    const r = new SR();
    r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    const finish = v => { if (done) return; done = true; try { r.abort(); } catch {} res(v); };
    r.onresult = e => finish([...e.results[0]].map(a => a.transcript));
    r.onerror = e => finish(e.error === "not-allowed" || e.error === "audio-capture" ? null : []);
    r.onend = () => finish([]);
    try { r.start(); } catch { finish(null); }
    setTimeout(() => finish([]), ms);

/* ---------------- finger sliding ---------------- */
/* One finger drags a handle left to right under the targets, which light up strictly in order.
   Only the first finger that grabs the handle counts; a palm or a second finger anywhere else is
   ignored, and touches away from the handle and targets do nothing. A quick tap on the handle hops
   it to the next target for children who can't drag yet. */
function slideAcross(host, handle, targets, onReach, onGrab, onRelease) {
  let visited = 0, pid = null, grab = 0, downX = 0, x = 10, done = false;
  const centerOf = i => { const hr = host.getBoundingClientRect(), r = targets[i].getBoundingClientRect(); return r.left + r.width / 2 - hr.left - handle.offsetWidth / 2; };
  const setX = v => { x = v; handle.style.left = v + "px"; };
  const reach = () => {
    const i = visited++;
    targets[i].classList.add("lit");
    if (visited === targets.length) done = true;
    onReach(i, done, pid !== null);
  };
  handle.addEventListener("pointerdown", e => {
    if (done || pid !== null) return;
    pid = e.pointerId; grab = e.clientX - x; downX = e.clientX;
    handle.classList.remove("hopping");
    try { handle.setPointerCapture(pid); } catch {}
    e.preventDefault();
    onGrab && onGrab();
  });
  handle.addEventListener("pointermove", e => {
    if (e.pointerId !== pid || done) return;
    const limit = centerOf(visited) + 8;
    setX(Math.max(10, Math.min(limit, e.clientX - grab)));
    while (!done && x >= centerOf(visited) - 4) reach();
  });
  handle.addEventListener("pointerup", e => {
    if (e.pointerId !== pid) return;
    pid = null;
    onRelease && onRelease();
    if (!done && Math.abs(e.clientX - downX) < 6) { handle.classList.add("hopping"); setX(centerOf(visited)); reach(); }
  });
  handle.addEventListener("pointercancel", e => { if (e.pointerId === pid) { pid = null; onRelease && onRelease(); } });
  requestAnimationFrame(() => setX(10));
  return {
    reset() { visited = 0; done = false; pid = null; targets.forEach(t => t.classList.remove("lit")); handle.classList.add("hopping"); setX(10); },
    dragging: () => pid !== null,
    visited: () => visited,
    done: () => done,
  };
}

/* ---------------- activities ---------------- */
function speakerBtn(fn) { return h("button", { class: "round say-btn", "aria-label": "Hear it again", onclick: fn }, "🔊"); }

const CONFUSABLE = [["b", "d", "p"], ["m", "n"], ["i", "e"], ["a", "o", "u"], ["f", "v", "th"], ["sh", "ch"], ["ee", "ea"], ["ir", "er"]];
function eggChoices(target, lvN) {
  const known = soundsUpTo(lvN).filter(s => s.g !== target.g);
  const n = Math.min(lvN < 3 ? 3 : 4, known.length + 1);
  const buddies = CONFUSABLE.find(g => g.includes(target.g)) || [];
  const ranked = shuffle(known).sort((a, b) => buddies.includes(b.g) - buddies.includes(a.g));
  const out = [target], usedP = new Set([target.p]);
  for (const s of ranked) { if (out.length >= n) break; if (!usedP.has(s.p)) { out.push(s); usedP.add(s.p); } }
  return shuffle(out);
}

const ACTIVITIES = {

  /* drag the frog across lily pads; each pad says its sound; then pick the picture */
  blend(area, word, lv, gen, silent) {
    return new Promise(resolve => {
      let first = true;
      const pond = h("div", { class: "pond" });
      // in "read it yourself" rounds the pads don't sound out; tapping one still helps if he's stuck
      const pads = word.t.map((t, i) => h("button", { class: "pad" + (t.p ? "" : " silent"), "aria-label": "Sound " + t.g,
        onclick: () => { if (silent) first = false; t.p ? say(snd(t.p)) : note(7); } }, t.g));
      const padRow = h("div", { class: "pads" }, pads);
      const frog = h("div", { class: "frog", role: "button", "aria-label": "Frog: drag across or tap to hop" }, "🐸");
      const arrow = h("div", { class: "hint-arrow" }, "➜");

      // after a miss the frog hops the word itself: each sound, then the whole word
      async function modelIt() {
        below.replaceChildren(h("div", { class: "bubble" }, "Watch the frog, then you try."));
        slide.reset(); frog.textContent = "🐸";
        pads.forEach(p => p.classList.remove("lit"));
        for (let i = 0; i < pads.length; i++) {
          if (gen !== screenGen) return;

          frog.style.left = (r.left + r.width / 2 - pr.left - frog.offsetWidth / 2) + "px";

        }

        await say(wordClip(word.w));

      // voice line: he says the sounds himself while sliding; the frog splashes back if his voice drops out
      (async () => {
        if (micMode() === "off" || !(await Mic.start()) || gen !== screenGen) {

          return;
        }
        voice = true;
        voiceLine.hidden = false;
        tip.textContent = "🎤 Slide the frog and say each sound. Keep your voice on!";
        tip.hidden = false;
        await Mic.calibrate();
        watching = true;
        watch();
      })();
      async function voiceDropped() {
        watching = false;
        frog.textContent = "💦"; bonk();
        gapMs = Math.min(1400, gapMs + 150);  // be a little more patient after each splash
        await say("q_voiceon");
        if (gen !== screenGen) return;
        reset();
        lastVoice = performance.now() + 600;
        watching = true;
        watch();
      }
      function watch() {
        const bar = voiceLine.firstChild;
        const tick = () => {

          const lvl = Mic.level(), on = lvl > Mic.threshold(), now = performance.now();
          if (on) lastVoice = Math.max(lastVoice, now);

        if (!picture) return sayItCheck();

        const score = w => { let s = 0; for (let i = 0; i < Math.min(w.w.length, word.w.length); i++) if (w.w[i] === word.w[i]) s += 2; if (w.w.length === word.w.length) s += 1; return s + Math.random() * 1.5; };

          const el = e.currentTarget;

            first = false; el.classList.add("shake"); bonk();
            await say("q_again");
            if (gen !== screenGen) return;
            await modelIt();  // model: the frog shows how, then he does it himself
            if (gen === screenGen) reset();

          el.classList.add("right"); arpeggio();

      }
      // tap the mic, say it fast; show what the recognizer heard (never counted against him)
      function wordCheck() {
        return new Promise(done => {
          const heard = h("div", { class: "bubble", hidden: true });

          const skip = h("button", { class: "pbtn", onclick: () => done() }, "Skip");

            if (alts.length && heardIt(word.w, alts)) {

              await say("q_heard");

            await wait(1500);

            h("div", { class: "bubble" }, "Tap the mic and say it fast!"), mic, heard, skip));

      }
      function sayItCheck() {
        const bell = h("button", { class: "big-btn pop", onclick: async () => {
          bell.disabled = true;
          await say(wordClip(word.w));
          below.replaceChildren(h("div", { class: "bubble" }, "Did you say it?"),
            h("button", { class: "round", style: "width:84px;height:84px;font-size:44px", "aria-label": "Yes, I said it", onclick: async () => { arpeggio(); await say(praise()); resolve(first); } }, "👍"),
            h("button", { class: "round", style: "width:84px;height:84px;font-size:44px", "aria-label": "Not yet, hop again", onclick: () => { first = false; reset(); } }, "🔁"));
        } }, "🔔 Ring");

  },

  /* hear the word, see the picture, tap letters in order; each correct letter climbs the scale */
  spell(area, word, lv, gen) {
    return new Promise(resolve => {
      let first = true, pos = 0, misses = 0;
      const slots = word.t.map(() => h("span", { class: "slot" }));
      const inWord = new Set(word.t.map(t => t.g)), inWordP = new Set(word.t.map(t => t.p).filter(Boolean));
      const extras = shuffle(soundsUpTo(lv.n).filter(s => !inWord.has(s.g) && !inWordP.has(s.p) && !s.g.includes("_"))).slice(0, Math.max(2, 6 - inWord.size));

function wavBytes(samples, rate) {
  const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);

  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 32767, true);

}

  let a = rms.findIndex(r => r > thr), b = rms.length - 1 - [...rms].reverse().findIndex(r => r > thr);
  if (a < 0) return null;
  const start = Math.max(0, (a - 4) * win), end = Math.min(x.length, (b + 6) * win);
  const y = x.slice(start, end);
  let top = 0; for (const v of y) top = Math.max(top, Math.abs(v));
  const gain = .9 / Math.max(top, 1e-4), fin = Math.round(rate * .005), fout = Math.round(rate * .025);
  for (let i = 0; i < y.length; i++) {
    let g = gain;
    if (i < fin) g *= i / fin;
    if (i > y.length - fout) g *= (y.length - i) / fout;
    y[i] *= g;
  }

}

  const out = h("textarea", { class: "pbtn", id: "sc-out", rows: "3", readonly: true, style: "width:100%;font-family:ui-monospace,monospace" });
  const refresh = () => {
    const bad = Object.entries(marks).filter(([, v]) => v === "bad").map(([k]) => k);
    out.value = bad.length ? "These sound wrong: " + bad.join(", ") : "Nothing marked wrong yet.";
  };
  const row = (key, label, clip, hint) => {
    const up = h("button", { class: "pbtn", "aria-label": label + " sounds right" }, "👍"), down = h("button", { class: "pbtn", "aria-label": label + " sounds wrong" }, "👎");
    const paint = () => { up.style.background = marks[key] === "ok" ? "#e5f7df" : ""; down.style.background = marks[key] === "bad" ? "#fde3d4" : ""; };
    up.onclick = () => { marks[key] = "ok"; save(); paint(); refresh(); };
    down.onclick = () => { marks[key] = "bad"; save(); paint(); refresh(); };
    paint();
    return h("div", { class: "prow sc-row" }, h("button", { class: "tile small", style: "min-width:84px", onclick: () => say(clip) }, label),
      h("span", { style: "flex:1;min-width:120px;color:var(--ink-soft)" }, hint), up, down);
  };
  const seen = new Set(), sounds = [];
  for (const lv of LEVELS) for (const snd0 of lv.sounds) if (!seen.has(snd0.p)) { seen.add(snd0.p); sounds.push({ ...snd0, n: lv.n }); }
  const example = p => (wordsUpTo(LEVELS.length).find(w => w.t.some(t => t.p === p)) || {}).w;
  refresh();
  screen("meadow", bar(h("button", { class: "round", "aria-label": "Back to grown-ups corner", onclick: showParent }, "⚙️"),
    h("h2", { style: "text-align:center;font-size:26px" }, "Sound check"), null),
    h("div", { class: "stage scroll" }, h("div", { class: "parent" },
      h("p", null, "Tap each tile to hear it. Mark 👎 anything that sounds wrong: the wrong sound, a buzz or stutter, cut off, or too quiet. Then tap Copy list and paste it to Claude."),
      h("h3", null, "Letter sounds"),
      h("div", { style: "display:grid;gap:6px" }, sounds.map(x => row("snd:" + x.p, x.g, snd(x.p), `Level ${x.n}${example(x.p) ? ` · as in "${example(x.p)}"` : ""}`))),
      DATA.unconfirmed.length ? h("h3", null, "Words the automatic check wasn't sure about") : null,
      h("div", { style: "display:grid;gap:6px" }, DATA.unconfirmed.map(w => row("word:" + w, w, wordClip(w), "Should say: " + w))),
      h("h3", null, "Send to Claude"), out,
      h("div", { class: "prow" }, h("button", { class: "pbtn", onclick: async () => {
        try { await navigator.clipboard.writeText(out.value); $("#sc-copied").textContent = "Copied."; }
        catch { out.select(); $("#sc-copied").textContent = "Select the text above and copy it."; }
      } }, "Copy list"), h("span", { id: "sc-copied" }, "")))));
}

/* ---------------- video time ---------------- */
/* Video rewards: each turn plays S.video.seconds of a video a grown-up chose, picking up where the last turn stopped. */
function videoList() {
  return S.video.links.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
    const [name, url] = line.includes("|") ? line.split("|").map(x => x.trim()) : ["Video", line];
    return { name, url, embed: embedFor(url) };
  }).filter(v => v.embed);
}
function embedFor(url) {
  let m;
  const base = "https://www.youtube-nocookie.com/embed/";
  if ((m = url.match(/[?&]list=([A-Za-z0-9_-]+)/))) return { src: base + "videoseries?list=" + m[1], key: m[1], list: true };
  if ((m = url.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/))) return { src: base + m[1], key: m[1] };
  if ((m = url.match(/\/channel\/UC([A-Za-z0-9_-]{22})/))) return { src: base + "videoseries?list=UU" + m[1], key: "UU" + m[1], list: true };
  return null;
}
/* ---------------- rewards ---------------- */
/* Stars he earns also go into a savings jar. He picks a reward to save for; short ones (video
   time) come around often, big real-world ones (cookie, trampoline park) take days or weeks.
   A grown-up sets the rewards and costs in the grown-ups corner. */
const rewardById = id => S.rewards.list.find(r => r.id === id) || S.rewards.list[0];
const canAfford = r => r && S.rewards.saved >= r.cost;
function rewardChip() {
  const goal = rewardById(S.rewards.goal);
  if (!goal) return null;
  const ready = S.rewards.list.some(canAfford);
  if (ready) return h("button", { class: "chip video-ready", onclick: showRewards }, `${canAfford(goal) ? goal.e : "🎁"} Reward ready!`);
  const pct = Math.min(100, Math.round(S.rewards.saved / goal.cost * 100));
  return h("button", { class: "chip", onclick: showRewards, "aria-label": "Rewards" }, goal.e + " ",
    h("span", { class: "vmeter" }, h("i", { style: `width:${pct}%` })), `${S.rewards.saved}/${goal.cost}`);
}
function showRewards() {
  const cards = S.rewards.list.map(r => {
    const pct = Math.min(100, Math.round(S.rewards.saved / r.cost * 100)), isGoal = r.id === S.rewards.goal;
    return h("div", { class: "reward-card" + (isGoal ? " goal" : "") },
      h("div", { class: "reward-emoji" }, r.e),
      h("div", { style: "min-width:0;flex:1" }, h("div", { class: "reward-name" }, r.name),
        h("div", { class: "reward-bar" }, h("i", { style: `width:${pct}%` })),
        h("div", { class: "sub", style: "font-size:16px" }, canAfford(r) ? "You have enough stars!" : `⭐ ${S.rewards.saved} of ${r.cost}`)),
      canAfford(r) ? h("button", { class: "big-btn", style: "font-size:22px;padding:8px 18px", onclick: () => claim(r) }, "Get it!")
        : isGoal ? h("span", { class: "chip", style: "font-size:16px" }, "Saving for this")
        : h("button", { class: "pbtn", onclick: () => { S.rewards.goal = r.id; save(); showRewards(); } }, "Save for this"));
  });
  screen("meadow", bar(homeBtn(), h("h2", { style: "text-align:center;font-size:30px;color:var(--falu)" }, "My rewards"), starChip()),
    h("div", { class: "stage scroll" }, h("div", { class: "sub" }, "Earn stars by reading. Pick what you're saving for!"), h("div", { class: "song-list", style: "width:min(680px,100%)" }, cards)));
}
function claim(r) {
  if (!canAfford(r)) return;
  if (r.kind === "video") return showVideoPicker(r);
  S.rewards.saved -= r.cost;
  S.rewards.owed.push({ id: r.id, e: r.e, name: r.name, d: today() });
  save();
  confetti(40, [r.e, "⭐", "🎉"]); arpeggio(); yodel();
  screen("meadow", bar(homeBtn(), null, starChip()), h("div", { class: "stage" },
    h("div", { class: "arrive", style: "animation:pop .6s" }, r.e),
    h("h2", { style: "font-size:44px;text-align:center" }, "You earned it!"),
    h("div", { class: "bubble", style: "font-size:30px" }, r.name),
    h("div", { class: "sub" }, "Show a grown-up! They'll make it happen."),
    h("button", { class: "big-btn", onclick: showMap }, "Keep climbing")));
}
function showVideoPicker(r) {
  const list = videoList();
  const body = list.length
    ? h("div", { class: "song-list" }, list.map(v => h("button", { class: "step", onclick: () => playVideo(v, r) }, h("span", { class: "ic" }, "🎬"), h("span", null, v.name))))
    : h("div", { class: "bubble" }, "Ask a grown-up to add videos in the grown-ups corner (hold ⚙️).");
  screen("meadow", bar(homeBtn(), h("h2", { style: "text-align:center;font-size:30px;color:var(--falu)" }, "Video time!"), starChip()),
    h("div", { class: "stage" }, h("div", { class: "sub" }, `You earned ${S.video.seconds} seconds of video. Pick one!`), body));
}
function playVideo(v, r) {
  const start = S.video.at[v.embed.key] || 0;
  const src = `${v.embed.src}${v.embed.src.includes("?") ? "&" : "?"}autoplay=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&fs=0&disablekb=1&start=${start}`;
  const frame = h("iframe", { class: "video-frame", src, title: v.name, allow: "autoplay; encrypted-media; picture-in-picture", referrerpolicy: "strict-origin-when-cross-origin" });
  const clock = h("div", { class: "chip", style: "font-size:26px" }, "");
  let left = S.video.seconds;
  // spend the stars as soon as the video starts, so leaving early can't replay it
  S.rewards.saved = Math.max(0, S.rewards.saved - r.cost);
  S.video.at[v.embed.key] = start + S.video.seconds;
  save();
  const gen = screen("meadow", bar(homeBtn(), h("div", { style: "text-align:center" }, clock), null),
    h("div", { class: "stage" }, frame, h("div", { class: "sub" }, window.location.hostname.endsWith("claude.ai") || window.location.protocol === "file:" ? "Videos play when the game is opened from its web address." : "")));
  const tick = () => {
    if (gen !== screenGen) return;
    clock.textContent = `🎬 ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    if (left-- <= 0) return videoDone();
    setTimeout(tick, 1000);
  };
  tick();
  function videoDone() {
    frame.remove();
    screen("meadow", bar(homeBtn(), null, starChip()), h("div", { class: "stage" },
      h("div", { class: "show pop" }, "🎬"), h("h2", { style: "font-size:40px" }, "Video time is over!"),
      h("div", { class: "sub" }, "Let's read some more and earn the next one."),
      h("button", { class: "big-btn", onclick: showMap }, "Keep climbing")));
    arpeggio();
  }
}

/* ---------------- grown-ups ---------------- */
function rewardEditor() {
  const rows = h("div", { style: "display:grid;gap:8px" });
  const addRow = r => rows.append(h("div", { class: "prow reward-row" },
    h("input", { class: "pbtn", "aria-label": "Emoji", value: r.e, style: "width:64px;text-align:center;font-size:22px" }),
    h("input", { class: "pbtn", "aria-label": "Reward name", value: r.name, style: "flex:1;min-width:160px" }),
    h("input", { class: "pbtn", "aria-label": "Stars needed", type: "number", min: "5", step: "5", value: r.cost, style: "width:100px" }),
    h("select", { class: "pbtn", "aria-label": "Kind" }, h("option", { value: "treat", selected: r.kind !== "video" || null }, "Real-world treat"), h("option", { value: "video", selected: r.kind === "video" || null }, "Video time")),
    h("button", { class: "pbtn", "aria-label": "Remove", onclick: e => e.currentTarget.parentElement.remove() }, "✕")));
  S.rewards.list.forEach(addRow);
  const msg = h("span", null, "");
  return h("div", { style: "display:grid;gap:8px" }, rows, h("div", { class: "prow" },
    h("button", { class: "pbtn", onclick: () => addRow({ e: "🎁", name: "", cost: 200, kind: "treat" }) }, "+ Add a reward"),
    h("button", { class: "pbtn", onclick: () => {
      const list = [...rows.children].map((row, i) => {
        const [e, name, cost, kind] = row.querySelectorAll("input, select");
        return { id: (name.value.trim() || "reward").toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + i, e: e.value.trim() || "🎁", name: name.value.trim(), cost: Math.max(5, +cost.value || 100), kind: kind.value };
      }).filter(r => r.name);
      if (!list.length) { msg.textContent = "Add at least one reward."; return; }
      const goalName = rewardById(S.rewards.goal)?.name;
      S.rewards.list = list;
      S.rewards.goal = (list.find(r => r.name === goalName) || list[0]).id;
      save(); msg.textContent = "Saved.";
    } }, "Save rewards"),
    h("button", { class: "pbtn", onclick: () => { S.rewards.saved += 100; save(); showParent(); } }, "Add 100 stars to the jar (testing)"),
    msg));
}
function micTester() {
  const status = h("p", null, !Mic.supported() ? "This page can't use the microphone. Open the game from its own https address." :
    `Microphone: available. Speech checking: ${Mic.recognizer() ? "available" : "not available in this browser"}.`);
  const meter = h("div", { class: "voiceline", style: "position:relative;left:0;right:0;width:100%;max-width:420px" }, h("i"));
  const out = h("p", null, "");
  let running = false;
  const test = h("button", { class: "pbtn", onclick: async () => {
    if (running) return;
    if (!(await Mic.start())) { out.textContent = "The microphone was blocked. Check the browser's microphone permission for this site."; return; }
    running = true; test.textContent = "Listening… say mmmaaat"; await Mic.calibrate(300);
    const stopAt = performance.now() + 6000;
    const tick = () => {
      const lvl = Mic.level();
      meter.firstChild.style.transform = `scaleY(${Math.min(1, .15 + lvl / (Mic.threshold() * 3))})`;
      meter.classList.toggle("on", lvl > Mic.threshold());
      if (performance.now() < stopAt && document.contains(meter)) requestAnimationFrame(tick);
      else { running = false; test.textContent = "Test voice line"; Mic.stop(); }
    };
    requestAnimationFrame(tick);
  } }, "Test voice line");
  const testWord = h("button", { class: "pbtn", onclick: async () => {
    Mic.stop(); out.textContent = "Say a word now…";
    const alts = await listenFor(5000);
    out.textContent = alts === null ? "Speech checking isn't available here." : alts.length ? "Heard: " + alts.map(a => `"${a.trim()}"`).join(", ") : "Didn't hear a word.";
  } }, "Test word check");
  return h("div", { style: "display:grid;gap:8px" }, status, h("div", { class: "prow" }, test, testWord), meter, out);
}
function showParent() {
  const n = S.unlocked;
  const soundGrid = h("div", { class: "grid-sounds" }, soundsUpTo(LEVELS.length).map(s => {
    const x = S.stats[sKey(s)];
    const words = wordsUpTo(LEVELS.length).filter(w => w.t.some(t => t.p === s.p)).map(w => S.stats[wKey(w)]).filter(Boolean);
    const seen = (x ? x.s : 0) + words.reduce((a, w) => a + w.s, 0), right = (x ? x.c : 0) + words.reduce((a, w) => a + w.c, 0);
    const pct = seen ? Math.round(right / seen * 100) : null;
    return h("div", { class: "gs " + (pct == null ? "" : pct >= 90 ? "g" : pct >= 70 ? "w" : "b") }, s.g, h("small", null, pct == null ? "–" : pct + "%"));
  }));
  const tough = Object.entries(S.stats).filter(([k, v]) => k.startsWith("word:") && v.m > 0).sort((a, b) => b[1].m - a[1].m).slice(0, 12).map(([k]) => k.slice(5));
  const recent = S.history.slice(-8).reverse().map(r => h("div", null, `${r.d} · Level ${r.n} ${STAGE[r.stage].name}: ${r.good}/${r.of}`));
  const sel = h("select", { class: "pbtn", id: "lvl-jump", "aria-label": "Jump to level" }, LEVELS.map(l => h("option", { value: l.n, selected: l.n === n ? true : null }, `Level ${l.n}: ${l.title}`)));
  let armed = false;
  const resetBtn = h("button", { class: "pbtn danger", onclick: () => {
    if (!armed) { armed = true; resetBtn.textContent = "Tap again to erase all progress"; return; }
    S = fresh(); save(); showMap();
  } }, "Reset progress");
  screen("meadow", bar(homeBtn(), h("h2", { style: "text-align:center;font-size:26px" }, "For grown-ups"), null),
    h("div", { class: "stage scroll" }, h("div", { class: "parent" },
      h("h2", null, "How Letters Are Alive teaches"),
      h("p", null, "Every level adds a few sounds and only uses words he can decode with sounds already taught. Letters make only their most common sound until Level 14 (Magic E). Each level has steps that must be mastered in order: hear-and-find the new sounds, blend words on the lily pads, spell words, then a mixed mastery check that also pulls review from earlier levels. Each step needs about 90% right on the first try. Missed sounds and words come back more often until they stick."),
      h("p", null, "Never tell him the word before he chooses. Let him slide the frog and say each sound, then say it fast. If he's stuck, have him slide again more slowly and stretch the sounds. Ten to fifteen minutes a day beats a long session."),
      h("div", { class: "prow" }, h("button", { class: "pbtn", onclick: showTenets }, "📖 Read the teaching principles (research notes)"),
        h("button", { class: "pbtn", onclick: showSoundCheck }, "🔊 Sound check"),
        h("button", { class: "pbtn", onclick: () => showRecorder(0) }, "🎙️ Record my letter sounds")),
      h("h3", null, "Sound accuracy"), h("p", null, "Includes words that use each sound. Green is 90% or better, yellow 70–89%, orange below 70%."), soundGrid,
      h("h3", null, "Words to watch"), h("p", null, tough.length ? tough.join(", ") : "None yet."),
      h("h3", null, "Recent practice"), h("div", { style: "display:grid;gap:4px;font-variant-numeric:tabular-nums" }, recent.length ? recent : "No sessions yet."),
      h("h3", null, "Placement"),
      h("p", null, "If he already knows early sounds, open a later level. Earlier levels stay available for review."),
      h("div", { class: "prow" }, sel, h("button", { class: "pbtn", onclick: () => { S.unlocked = Math.max(S.unlocked, +sel.value); save(); showLevel(+sel.value); } }, "Open this level")),
      h("h3", null, "Rewards"),
      h("p", null, "Every star he earns also goes into a savings jar (spending stars in the farm shop doesn't take from it). He picks a reward to save for. Video rewards play right away; anything else shows a \"Show a grown-up!\" screen and waits in the list below until you mark it given. As a guide, one mastered step earns about 25 stars and a whole level about 150."),
      h("p", null, `In the jar: ⭐ ${S.rewards.saved}`),
      rewardEditor(),
      S.rewards.owed.length ? h("div", { style: "display:grid;gap:6px" }, h("h3", null, "Rewards to give"), S.rewards.owed.map((o, i) =>
        h("div", { class: "prow" }, `${o.e} ${o.name} (earned ${o.d})`, h("button", { class: "pbtn", onclick: () => { S.rewards.owed.splice(i, 1); save(); showParent(); } }, "Given ✓")))) : null,
      h("h3", null, "Videos"),
      h("p", null, "One per line as Name | link. YouTube video, playlist and channel links (youtube.com/channel/UC…) work; @handle links don't. Each turn picks up where the last one stopped."),
      h("textarea", { id: "v-links", class: "pbtn", rows: "4", style: "width:100%;font-family:ui-monospace,monospace;font-size:14px" }, S.video.links),
      h("div", { class: "prow" },
        h("label", { for: "v-secs" }, "Seconds per video turn "), h("input", { id: "v-secs", class: "pbtn", type: "number", min: "15", max: "600", step: "15", value: S.video.seconds, style: "width:90px" }),
        h("button", { class: "pbtn", onclick: () => {
          S.video.seconds = Math.max(15, +$("#v-secs").value || 60);
          S.video.links = $("#v-links").value;
          save();
          $("#v-saved").textContent = `Saved. ${videoList().length} video${videoList().length === 1 ? "" : "s"} ready.`;
        } }, "Save videos")),
      h("p", { id: "v-saved" }, ""),
      h("h3", null, "Microphone practice"),
      h("p", null, "Voice line: in Lily Pad Hop he says the sounds himself while sliding the frog, and the pads stay quiet. If his voice drops out between sounds, the frog splashes back so he learns to keep his voice on (mmmaaat, not m… a… t). Word check adds a tap-and-say-it-fast step after each slide. The speech recognizer is shown for encouragement only and never marks him wrong. Needs the game opened from its own web address (https), not the claude.ai preview."),
      h("div", { class: "prow" }, [["off", "Off"], ["voice", "Voice line"], ["word", "Voice line + word check"]].map(([k, label]) =>
        h("button", { class: "pbtn", style: micMode() === k ? "border-color:var(--sv-blue);background:#e3eefb" : "", onclick: () => { S.mic = k; save(); showParent(); } }, (micMode() === k ? "● " : "") + label))),
      micTester(),
      h("h3", null, "Developer mode"),
      h("p", null, S.dev ? "On: every level and step is open, whether or not it has been mastered." : "Off: levels and steps unlock only through mastery."),
      h("div", { class: "prow" }, h("button", { class: "pbtn", onclick: () => { S.dev = !S.dev; save(); showParent(); } }, S.dev ? "Turn off (strict mastery)" : "Turn on (open everything)")),
      h("h3", null, "Progress on this device"),
      h("p", null, "Progress is saved in this browser only. Add the page to the iPad home screen and always open it from there."),
      h("div", { class: "prow" }, resetBtn))));
}

showMap();
